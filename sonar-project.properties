# SonarQube Configuration for CLI Scanner
sonar.projectKey=pruebatecnica
sonar.projectName=Prueba Tecnica Backend

# URL del servidor SonarQube (local)
sonar.host.url=http://localhost:9000

# Fuentes del proyecto
sonar.sources=src/main/java

# Tests del proyecto
sonar.tests=src/test/java

# Exclusiones del análisis estático
sonar.exclusions=**/model/**,**/*Application.java

# Exclusiones para cobertura
sonar.coverage.exclusions=**/model/**,**/*Application.java,**/dto/**,**/config/**

# Clases compiladas
sonar.java.binaries=build/classes/java/main
sonar.java.test.binaries=build/classes/java/test

# Encoding y versión de Java
sonar.sourceEncoding=UTF-8
sonar.java.source=21
sonar.java.target=21

# Reportes de JaCoCo (si se quiere usar cobertura)
# sonar.coverage.jacoco.xmlReportPaths=build/reports/jacoco/test/jacocoTestReport.xml
